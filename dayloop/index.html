<html lang="en">

<style>
:root{--paper:#f7f3eb;--paper2:#fbf8f2;--ink:#303a39;--muted:#85877f;--line:#e4ddd1;--sage:#87998a;--sage-soft:#e8ece5;--blue:#8da2aa;--blue-soft:#e8edef;--coral:#bd8878;--shadow:0 12px 34px #534a3b12}
*{box-sizing:border-box}html{min-height:100%;background:#e8e2d7;-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(90deg,#dce2df 0 3.5%,#eee8de 3.5% 100%);-webkit-tap-highlight-color:transparent}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.book{position:relative;max-width:1420px;min-height:100vh;margin:0 auto;padding:26px 88px 30px 54px;background:var(--paper);border:1px solid #e5ddcf;border-left:8px solid #9aadb0;border-radius:10px 18px 18px 10px;box-shadow:0 18px 50px #51463818}
.book:before{content:"";position:absolute;left:-7px;top:0;bottom:0;width:2px;background:#c5d0cc}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:2px 4px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}.bear{width:32px;height:32px;flex:none;color:var(--ink)}.brand h1{margin:0;font-size:27px;line-height:1;font-weight:550;letter-spacing:-1.2px}
.header-date{font-size:12px;color:var(--muted);letter-spacing:.3px}.today-btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:5px;padding:7px 13px;font-size:12px}
.layout{display:grid;grid-template-columns:minmax(300px,.92fr) minmax(430px,1.08fr);gap:34px;padding-top:25px}.left-col{padding:0 2px 0 4px}.right-col{border-left:1px solid var(--line);padding:0 4px 0 34px;min-width:0}
.month-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 18px}.month-head h2{font-size:21px;font-weight:550;letter-spacing:-.6px;margin:0}.month-controls{display:flex;gap:5px}.month-controls button,.day-move button{width:31px;height:31px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;font-size:18px;line-height:1}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;padding:7px 0;color:var(--muted);font-size:10px;font-weight:600}.date-cell{position:relative;min-height:56px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px}.date-cell.other{color:#b7b3aa}.date-cell.today:not(.selected){border-color:#b6c2b6}.date-cell.selected{background:var(--blue-soft);border-color:#c5d1d3;color:#334448}.date-cell .mark{width:4px;height:4px;border-radius:50%;background:var(--sage)}.month-summary{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border:1px solid var(--line);border-radius:7px;background:#ffffff38}.summary-item{text-align:center;padding:14px 4px}.summary-item+.summary-item{border-left:1px solid var(--line)}.summary-item span{display:block;color:var(--muted);font-size:11px}.summary-item strong{display:block;margin-top:3px;font-size:19px;font-weight:550;letter-spacing:-.4px}
.selected-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 17px}.selected-head h2{margin:0;font-size:17px;font-weight:550;letter-spacing:-.3px}.day-move{display:flex;gap:5px}.day-move button{font-size:16px}
.section{padding:0 0 17px;margin:0 0 17px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0;margin-bottom:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-head h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.2px}.section-head small{font-size:11px;color:var(--muted)}.add-btn{width:27px;height:27px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);font-size:18px;line-height:1}
.habit-table{width:100%;border-collapse:collapse;table-layout:fixed}.habit-table th{font-size:10px;font-weight:500;color:var(--muted);padding:5px 0 8px}.habit-table th:first-child{text-align:left;width:29%}.habit-table td{padding:8px 0;border-top:1px solid #eae4da;font-size:12px}.habit-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px!important}.habit-dot{display:block;margin:auto;width:19px;height:19px;border:1px solid #c9c5bb;border-radius:50%;background:transparent;padding:0;min-height:0}.habit-dot.done{background:var(--sage);border-color:var(--sage);position:relative}.habit-dot.done:after{content:"";position:absolute;left:6px;top:4px;width:5px;height:8px;border:solid white;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.plan-list{display:grid;gap:0}.plan-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eae4da}.plan-row:first-child{border-top:0}.plan-check{width:17px;height:17px;accent-color:var(--sage);flex:none}.plan-title{flex:1;min-width:0;font-size:12px}.plan-row.done .plan-title{text-decoration:line-through;color:#99978f}.delete-btn{border:0;background:transparent;color:#aaa49a;font-size:17px;padding:0 4px;min-height:24px}
.note-input{width:100%;min-height:94px;resize:vertical;border:1px solid var(--line);border-radius:7px;background:#ffffff45;padding:12px;color:var(--ink);font-size:13px;line-height:1.6}.note-input::placeholder{color:#aaa49f}.save-state{font-size:10px;color:var(--muted);text-align:right;margin-top:4px}
.index{position:absolute;right:0;top:118px;transform:translateX(1px);width:78px;display:flex;flex-direction:column;gap:5px;z-index:3}.index button{min-height:74px;border:1px solid #e3dacc;border-right:0;border-radius:9px 0 0 9px;background:#f4efe6;color:#59615e;box-shadow:0 3px 8px #534a3b0c;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;line-height:1.15}.index button .tab-icon{font-size:17px}.index button.active{background:#dfe7e7;color:#34484b;border-color:#c6d1d1;transform:translateX(-5px);min-height:78px}
.page{display:none}.page.active{display:block}.full-page{grid-column:1/-1;min-height:500px}.full-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.full-head h2{font-size:21px;font-weight:550;margin:0}.full-sub{font-size:12px;color:var(--muted);margin:4px 0 18px}.full-habit{display:grid;grid-template-columns:minmax(120px,1fr) repeat(7,34px);gap:10px;align-items:center;padding:12px 5px;border-bottom:1px solid var(--line)}.full-habit .habit-label{font-size:13px}.full-habit .habit-dot{width:22px;height:22px}.archive-list{max-width:760px}.archive-item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}.archive-date{width:100px;flex:none;color:var(--muted);font-size:11px}.archive-content{flex:1;font-size:13px;white-space:pre-wrap}.archive-actions{display:flex;gap:6px}.text-btn{border:0;background:transparent;color:var(--muted);font-size:11px;padding:3px}.empty{padding:24px 8px;color:var(--muted);font-size:12px;text-align:center}
.mobile-index{display:none}
@media(max-width:850px){body{background:var(--paper)}.book{padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));border:0;border-radius:0;box-shadow:none;min-height:100dvh}.book:before{display:none}header{padding-bottom:14px}.brand h1{font-size:24px}.layout{display:block;padding-top:18px}.left-col{padding:0}.right-col{border-left:0;border-top:1px solid var(--line);padding:20px 0 0;margin-top:20px}.index{display:none}.mobile-index{display:flex;position:sticky;top:0;z-index:5;gap:5px;padding:9px 0;background:#f7f3ebed;backdrop-filter:blur(12px);overflow-x:auto}.mobile-index button{flex:1;min-width:max-content;border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--muted);padding:8px 11px;font-size:11px}.mobile-index button.active{background:var(--blue-soft);color:#34484b;border-color:#c6d1d1}.date-cell{min-height:47px}.calendar{gap:2px}.summary-grid{margin-top:8px}.month-summary{margin-top:18px}.full-habit{grid-template-columns:minmax(95px,1fr) repeat(7,29px);gap:5px}.full-habit .habit-dot{width:20px;height:20px}}
@media(max-width:390px){.book{padding-left:12px;padding-right:12px}.date-cell{min-height:42px}.habit-table td{font-size:11px}.habit-table th:first-child{width:25%}.habit-dot{width:17px;height:17px}.full-habit{grid-template-columns:minmax(82px,1fr) repeat(7,25px);gap:3px}}
</style>
</head>
<body>
<div class="book">
<header>
  <div class="brand"><svg class="bear" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M10 17.5C7.2 14.8 7.2 10.4 10 7.8C12.8 5.2 17.1 6.1 19.1 9.2C22.2 8.1 25.8 8.1 28.9 9.2C30.9 6.1 35.2 5.2 38 7.8C40.8 10.4 40.8 14.8 38 17.5C40.1 20.2 41.2 23.4 41.2 27C41.2 35.3 33.5 40.2 24 40.2C14.5 40.2 6.8 35.3 6.8 27C6.8 23.4 7.9 20.2 10 17.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18.5" cy="24" r="1.5" fill="currentColor"/><circle cx="29.5" cy="24" r="1.5" fill="currentColor"/><path d="M22 29.2C23.2 30.3 24.8 30.3 26 29.2M24 26.5V28.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><h1>dayloop</h1></div>
  <div style="display:flex;align-items:center;gap:10px"><span class="header-date" id="headerDate"></span><button class="today-btn" id="todayBtn">Today</button></div>
</header>
<nav class="mobile-index" id="mobileIndex" aria-label="Pages">
  <button class="active" data-page="overview">Overview</button><button data-page="habits">Habits</button><button data-page="plans">Mini Plan</button><button data-page="notes">Mini Note</button>
</nav>
<nav class="index" id="sideIndex" aria-label="Pages">
  <button class="active" data-page="overview"><span class="tab-icon">▦</span>Overview</button>
  <button data-page="habits"><span class="tab-icon">◌</span>Habits</button>
  <button data-page="plans"><span class="tab-icon">☑</span>Mini Plan</button>
  <button data-page="notes"><span class="tab-icon">▤</span>Mini Note</button>
</nav>
<main class="layout">
<section class="page active left-col" id="overviewLeft">
  <div class="month-head"><h2 id="monthLabel"></h2><div class="month-controls"><button id="prevMonth" aria-label="Previous month">‹</button><button id="nextMonth" aria-label="Next month">›</button></div></div>
  <div class="calendar" id="calendar"></div>
  <div class="month-summary"><div class="eyebrow">This month</div><div class="summary-grid">
    <div class="summary-item"><span>Habits</span><strong id="summaryHabits">—</strong></div><div class="summary-item"><span>Plans</span><strong id="summaryPlans">0 / 0</strong></div><div class="summary-item"><span>Notes</span><strong id="summaryNotes">0</strong></div>
  </div></div>
</section>
<section class="page active right-col" id="overviewRight">
  <div class="selected-head"><h2 id="selectedDate"></h2><div class="day-move"><button id="prevDay" aria-label="Previous day">‹</button><button id="nextDay" aria-label="Next day">›</button></div></div>
  <section class="section"><div class="section-head"><h3>Habit tracker</h3><small id="habitCount"></small></div><div id="dailyHabits"></div></section>
  <section class="section"><div class="section-head"><h3>Mini plan</h3><button class="add-btn" id="addPlan" aria-label="Add plan">+</button></div><div class="plan-list" id="dailyPlans"></div></section>
  <section class="section"><div class="section-head"><h3>Mini note</h3><small id="noteSaved">Saved on this device</small></div><textarea class="note-input" id="dailyNote" placeholder="A few words about today..." aria-label="Daily note"></textarea></section>
</section>
<section class="page full-page" id="habitsPage">
  <div class="full-head"><h2>Habit tracker</h2><button class="today-btn" id="addHabit">＋ Add habit</button></div><p class="full-sub" id="habitMonthLabel"></p><div id="habitOverview"></div>
</section>
<section class="page full-page" id="plansPage">
  <div class="full-head"><h2>Mini plan</h2><button class="today-btn" id="addPlanPage">＋ Add plan</button></div><p class="full-sub">Small things you want to do, one day at a time.</p><div class="archive-list" id="planArchive"></div>
</section>
<section class="page full-page" id="notesPage">
  <div class="full-head"><h2>Mini note</h2></div><p class="full-sub">A little collection of everyday moments.</p><div class="archive-list" id="noteArchive"></div>
</section>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const DATA_KEY='dayloop-data-v1',VIEW_KEY='dayloop-view-v1';
const today=new Date();today.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=s=>parse(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const blank={events:[],tasks:[],habits:[],habitLogs:{},goals:[],expenses:[],notes:[],trips:[]};
let db;try{db={...blank,...JSON.parse(localStorage.getItem(DATA_KEY)||'{}')}}catch{db={...blank}}
db.tasks=Array.isArray(db.tasks)?db.tasks:[];db.habits=Array.isArray(db.habits)?db.habits:[];db.notes=Array.isArray(db.notes)?db.notes:[];db.habitLogs=db.habitLogs||{};
let viewDate=new Date(today.getFullYear(),today.getMonth(),1),selected=iso(today),page='overview';
try{const v=JSON.parse(localStorage.getItem(VIEW_KEY)||'{}');if(/^\d{4}-\d{2}-\d{2}$/.test(v.selected||''))selected=v.selected;if(/^\d{4}-\d{2}$/.test(v.viewMonth||'')){const [y,m]=v.viewMonth.split('-').map(Number);viewDate=new Date(y,m-1,1)}if(['overview','habits','plans','notes'].includes(v.page))page=v.page}catch{}
function persist(){localStorage.setItem(DATA_KEY,JSON.stringify(db));render()}
function persistView(){localStorage.setItem(VIEW_KEY,JSON.stringify({page,selected,viewMonth:iso(viewDate).slice(0,7)}))}
function setPage(next){page=next;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));['overviewLeft','overviewRight','habitsPage','plansPage','notesPage'].forEach((id,i)=>$(id).classList.toggle('active',['overview','overview','habits','plans','notes'][i]===page));persistView();render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function monthDays(date){const first=new Date(date.getFullYear(),date.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());return Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d})}
function monthKey(d){return iso(d).slice(0,7)}
function habitsForDay(day){return db.habits}
function doneHabitIds(day){return db.habitLogs[day]||[]}
function toggleHabit(id,day,checked){const set=new Set(doneHabitIds(day));checked?set.add(id):set.delete(id);db.habitLogs[day]=[...set];persist()}
function noteFor(day){return db.notes.find(n=>n.date===day)||null}
function saveNote(day,body){let n=noteFor(day);if(!body.trim()){if(n)db.notes=db.notes.filter(x=>x!==n)}else if(n){n.body=body;n.title=n.title||'Daily note'}else db.notes.push({id:uid(),date:day,title:'Daily note',body});localStorage.setItem(DATA_KEY,JSON.stringify(db));$('noteSaved').textContent='Saved';renderSummary()}
function dayPlans(day){return db.tasks.filter(t=>t.date===day)}
function addPlan(){const title=prompt('What small thing would you like to do?');if(!title||!title.trim())return;db.tasks.push({id:uid(),title:title.trim(),date:selected,done:false,priority:'Normal'});persist()}
function addHabit(){const name=prompt('What habit would you like to track?');if(!name||!name.trim())return;db.habits.push({id:uid(),name:name.trim()});persist()}
function renderCalendar(){const days=monthDays(viewDate),names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let html=names.map(n=>'<div class="weekday">'+n+'</div>').join('');html+=days.map(d=>{const key=iso(d),other=d.getMonth()!==viewDate.getMonth(),hasPlan=dayPlans(key).length,hasNote=!!noteFor(key),hasHabit=doneHabitIds(key).length;return '<button class="date-cell '+(other?'other ':'')+(key===iso(today)?'today ':'')+(key===selected?'selected':'')+'" data-date="'+key+'"><span>'+d.getDate()+'</span>'+(hasPlan||hasNote||hasHabit?'<i class="mark"></i>':'')+'</button>'}).join('');$('calendar').innerHTML=html;$('calendar').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});$('monthLabel').textContent=viewDate.toLocaleDateString('en-AU',{month:'long',year:'numeric'})}
function renderDaily(){const d=parse(selected);$('selectedDate').textContent=d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('headerDate').textContent=fmt(iso(today));const days=Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()-((d.getDay()+6)%7)+i);return x});let h='<table class="habit-table"><thead><tr><th></th>'+days.map(x=>'<th>'+x.toLocaleDateString('en-AU',{weekday:'narrow'})+'</th>').join('')+'</tr></thead><tbody>';if(!db.habits.length)h+='<tr><td colspan="8" class="empty">Add your first habit from the Habits tab.</td></tr>';else db.habits.forEach(item=>{h+='<tr><td class="habit-name">'+esc(item.name)+'</td>'+days.map(x=>{const day=iso(x),done=doneHabitIds(day).includes(item.id);return '<td><button class="habit-dot '+(done?'done':'')+'" data-habit="'+esc(item.id)+'" data-day="'+day+'" aria-label="'+esc(item.name)+' '+day+'"></button></td>'}).join('')+'</tr>'});h+='</tbody></table>';$('dailyHabits').innerHTML=h;$('dailyHabits').querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>toggleHabit(b.dataset.habit,b.dataset.day,!doneHabitIds(b.dataset.day).includes(b.dataset.habit)));const done=db.habits.filter(x=>doneHabitIds(selected).includes(x.id)).length;$('habitCount').textContent=db.habits.length?done+' of '+db.habits.length+' today':'No habits yet';
const plans=dayPlans(selected);$('dailyPlans').innerHTML=plans.length?plans.map(t=>'<label class="plan-row '+(t.done?'done':'')+'"><input class="plan-check" type="checkbox" data-plan="'+esc(t.id)+'" '+(t.done?'checked':'')+'><span class="plan-title">'+esc(t.title)+'</span><button class="delete-btn" type="button" data-delete-plan="'+esc(t.id)+'" aria-label="Delete">×</button></label>').join(''):'<div class="empty">Nothing on your mini plan yet.</div>';$('dailyPlans').querySelectorAll('[data-plan]').forEach(c=>c.onchange=()=>{const t=db.tasks.find(x=>x.id===c.dataset.plan);if(t)t.done=c.checked;persist()});$('dailyPlans').querySelectorAll('[data-delete-plan]').forEach(b=>b.onclick=()=>{db.tasks=db.tasks.filter(x=>x.id!==b.dataset.deletePlan);persist()});
const note=noteFor(selected);$('dailyNote').value=note?.body||'';$('noteSaved').textContent='Saved on this device'}
function renderSummary(){const m=monthKey(viewDate),monthTasks=db.tasks.filter(t=>(t.date||'').startsWith(m)),complete=monthTasks.filter(t=>t.done).length,monthNotes=db.notes.filter(n=>(n.date||'').startsWith(m)).length;let total=0,done=0;const days=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,0).getDate();db.habits.forEach(h=>{total+=days;for(let d=1;d<=days;d++)if(doneHabitIds(iso(new Date(viewDate.getFullYear(),viewDate.getMonth(),d))).includes(h.id))done++});$('summaryHabits').textContent=total?Math.round(done/total*100)+'%':'—';$('summaryPlans').textContent=complete+' / '+monthTasks.length;$('summaryNotes').textContent=monthNotes}
function renderHabitPage(){const d=daysInMonth(viewDate),m=monthKey(viewDate);$('habitMonthLabel').textContent=viewDate.toLocaleDateString('en-AU',{month:'long',year:'numeric'})+' · Tap a circle to check in';let html='<div class="full-habit" style="color:var(--muted);font-size:10px"><span>Habit</span>'+Array.from({length:7},(_,i)=>'<span style="text-align:center">'+['M','T','W','T','F','S','S'][i]+'</span>').join('')+'</div>';if(!db.habits.length)html+='<div class="empty">Your habit tracker starts with one small routine.</div>';db.habits.forEach(h=>{const start=new Date(viewDate.getFullYear(),viewDate.getMonth(),1),offset=(start.getDay()+6)%7;let row='<div class="full-habit"><span class="habit-label">'+esc(h.name)+'</span>';for(let i=0;i<7;i++){const dayNum=1+((i-offset+d)%d),day=iso(new Date(viewDate.getFullYear(),viewDate.getMonth(),dayNum)),valid=dayNum<=d,done=valid&&doneHabitIds(day).includes(h.id);row+='<button class="habit-dot '+(done?'done':'')+'" '+(valid?'data-fullhabit="'+esc(h.id)+'" data-day="'+day+'"':'disabled')+' aria-label="'+day+'"></button>'}row+='</div>';html+=row});$('habitOverview').innerHTML=html;$('habitOverview').querySelectorAll('[data-fullhabit]').forEach(b=>b.onclick=()=>toggleHabit(b.dataset.fullhabit,b.dataset.day,!doneHabitIds(b.dataset.day).includes(b.dataset.fullhabit)))}
function daysInMonth(d){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function renderPlanArchive(){const a=db.tasks.slice().sort((x,y)=>(y.date||'').localeCompare(x.date||''));$('planArchive').innerHTML=a.length?a.map(t=>'<div class="archive-item"><div class="archive-date">'+(t.date?fmt(t.date):'No date')+'</div><div class="archive-content" style="'+(t.done?'text-decoration:line-through;color:var(--muted)':'')+'">'+esc(t.title)+'</div><div class="archive-actions"><button class="text-btn" data-archive-check="'+esc(t.id)+'">'+(t.done?'Undo':'Done')+'</button><button class="text-btn" data-archive-delete="'+esc(t.id)+'">Delete</button></div></div>').join(''):'<div class="empty">Your little plans will appear here.</div>';$('planArchive').querySelectorAll('[data-archive-check]').forEach(b=>b.onclick=()=>{const t=db.tasks.find(x=>x.id===b.dataset.archiveCheck);if(t)t.done=!t.done;persist()});$('planArchive').querySelectorAll('[data-archive-delete]').forEach(b=>b.onclick=()=>{db.tasks=db.tasks.filter(x=>x.id!==b.dataset.archiveDelete);persist()})}
function renderNoteArchive(){const a=db.notes.filter(n=>(n.body||'').trim()).slice().sort((x,y)=>(y.date||'').localeCompare(x.date||''));$('noteArchive').innerHTML=a.length?a.map(n=>'<div class="archive-item"><div class="archive-date">'+fmt(n.date)+'</div><div class="archive-content">'+esc(n.body)+'</div><button class="text-btn" data-open-note="'+n.date+'">Open</button></div>').join(''):'<div class="empty">Your daily notes will be collected here.</div>';$('noteArchive').querySelectorAll('[data-open-note]').forEach(b=>b.onclick=()=>{selected=b.dataset.openNote;setPage('overview')})}
function render(){renderCalendar();renderDaily();renderSummary();renderHabitPage();renderPlanArchive();renderNoteArchive();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));['overviewLeft','overviewRight','habitsPage','plansPage','notesPage'].forEach((id,i)=>$(id).classList.toggle('active',['overview','overview','habits','plans','notes'][i]===page));persistView()}
$('prevMonth').onclick=()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);render()};$('nextMonth').onclick=()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);render()};$('prevDay').onclick=()=>{const d=parse(selected);d.setDate(d.getDate()-1);selected=iso(d);render()};$('nextDay').onclick=()=>{const d=parse(selected);d.setDate(d.getDate()+1);selected=iso(d);render()};$('todayBtn').onclick=()=>{selected=iso(today);viewDate=new Date(today.getFullYear(),today.getMonth(),1);setPage('overview')};$('addPlan').onclick=$('addPlanPage').onclick=addPlan;$('addHabit').onclick=addHabit;
$('dailyNote').addEventListener('input',()=>{saveNote(selected,$('dailyNote').value)});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
